<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>아리울초 전입교원 AI 도우미</title>
  <style>
    :root{
      color-scheme: light dark;
      --bg: transparent;
      --card:#fff;
      --text:#191919;
      --sub:#6b7280;
      --line:#e5e7eb;
      --soft:#f7f7f5;
      --soft2:#f3f4f6;
      --accent:#2563eb;
      --accent-soft:#eff6ff;
      --warn:#92400e;
      --warn-bg:#fffbeb;
      --danger:#b91c1c;
      --danger-bg:#fef2f2;
      --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --card:#1f1f1f;--text:#f5f5f5;--sub:#b0b3b8;--line:#383838;--soft:#262626;--soft2:#2d2d2d;
        --accent:#60a5fa;--accent-soft:#172554;--warn:#fcd34d;--warn-bg:#3a2f12;--danger:#fca5a5;--danger-bg:#3a1d1d;--shadow:none;
      }
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:920px;margin:0 auto;padding:6px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
    .header{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
    .icon{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
    h1{font-size:22px;line-height:1.25;margin:0;font-weight:850;letter-spacing:-.02em}
    .desc{font-size:14px;line-height:1.55;color:var(--sub);margin-top:5px}
    .quick{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
    .chip{border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer}
    .chip:hover{background:var(--soft2)}
    .composer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
    textarea{width:100%;min-height:86px;max-height:220px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:12px 13px;font:inherit;font-size:15px;line-height:1.55;outline:none}
    textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
    button.ask{height:46px;border:0;border-radius:12px;background:var(--accent);color:#fff;padding:0 17px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
    button.ask:disabled{opacity:.55;cursor:not-allowed}
    .hint{font-size:12px;color:var(--sub);margin-top:7px}
    .result{margin-top:14px;display:none}
    .answerbox{background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:14px}
    .answer-title{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:8px}
    .answer{font-size:15px;line-height:1.75;white-space:pre-wrap}
    .warning{margin-top:10px;background:var(--warn-bg);color:var(--warn);border-radius:11px;padding:9px 11px;font-size:12.5px;line-height:1.5}
    .sources{margin-top:11px;display:grid;gap:7px}
    .sources-title{font-size:12px;color:var(--sub);font-weight:800}
    .source{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px;text-decoration:none;color:var(--text);font-size:13px;font-weight:700}
    .source:hover{background:var(--soft)}
    .source span:last-child{color:var(--sub)}
    .loading{margin-top:14px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--sub);font-size:14px;display:none}
    .error{margin-top:14px;background:var(--danger-bg);color:var(--danger);border-radius:14px;padding:12px;font-size:13px;line-height:1.55;display:none}
    .foot{margin-top:11px;color:var(--sub);font-size:11.5px;text-align:right}
    @media(max-width:640px){.card{padding:14px}.composer{grid-template-columns:1fr}.ask{width:100%}.header{align-items:flex-start}h1{font-size:19px}}
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <div class="header">
        <div class="icon">🤖</div>
        <div>
          <h1>아리울초 전입교원 AI 도우미</h1>
          <div class="desc">전입교원 가이드에 정리된 내용만 바탕으로 답합니다. 확인되지 않은 내용은 추측하지 않습니다.</div>
        </div>
      </div>

      <div class="quick" aria-label="빠른 질문">
        <button class="chip" data-q="질병결석은 어떤 서류가 필요하고 언제까지 제출하나요?">출결</button>
        <button class="chip" data-q="교외체험학습은 며칠 전까지 신청하고 결과보고서는 언제까지 내나요?">교외체험학습</button>
        <button class="chip" data-q="수행평가와 생활기록부 작성에서 꼭 주의해야 할 점은 무엇인가요?">평가·생기부</button>
        <button class="chip" data-q="전입 학생 웨일북은 어떻게 처리하나요?">웨일북</button>
        <button class="chip" data-q="연가, 병가, 출장, 조퇴 결재라인은 어떻게 되나요?">복무</button>
        <button class="chip" data-q="학생평가나 에듀테크 문제는 어떤 담당 업무에 문의하면 되나요?">업무 담당</button>
      </div>

      <div class="composer">
        <textarea id="question" maxlength="500" placeholder="예: 교외체험학습을 5일 이상 가면 담임이 따로 해야 할 일이 있나요?"></textarea>
        <button id="ask" class="ask">질문하기</button>
      </div>
      <div class="hint">Enter는 줄바꿈, Ctrl+Enter 또는 ⌘+Enter로 질문합니다.</div>

      <div id="loading" class="loading">가이드에서 관련 내용을 찾고 답변을 작성하고 있습니다…</div>
      <div id="error" class="error"></div>

      <section id="result" class="result">
        <div class="answerbox">
          <div class="answer-title">답변</div>
          <div id="answer" class="answer"></div>
          <div id="warning" class="warning" style="display:none"></div>
        </div>
        <div id="sources" class="sources"></div>
      </section>

      <div class="foot">AI 답변은 전입교원 가이드의 보조 검색 기능입니다. 최신 공문·해당 학년도 지침이 우선합니다.</div>
    </main>
  </div>

  <script>
    const q = document.getElementById('question');
    const askBtn = document.getElementById('ask');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const result = document.getElementById('result');
    const answer = document.getElementById('answer');
    const warning = document.getElementById('warning');
    const sources = document.getElementById('sources');

    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        q.value = btn.dataset.q || '';
        q.focus();
      });
    });

    q.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) ask();
    });

    askBtn.addEventListener('click', ask);

    function escapeHtml(str=''){
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    async function ask(){
      const question = q.value.trim();
      if(!question){ q.focus(); return; }

      askBtn.disabled = true;
      loading.style.display = 'block';
      error.style.display = 'none';
      result.style.display = 'none';

      try{
        const res = await fetch('/api/teacher-ai', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({question})
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        answer.textContent = data.answer || '답변을 생성하지 못했습니다.';

        if(data.warning){
          warning.textContent = `⚠️ ${data.warning}`;
          warning.style.display = 'block';
        } else {
          warning.style.display = 'none';
        }

        const list = data.sources || [];
        sources.innerHTML = list.length
          ? `<div class="sources-title">근거 페이지</div>` + list.map(s => `
              <a class="source" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">
                <span>📄 ${escapeHtml(s.title)}</span><span>열기 ↗</span>
              </a>`).join('')
          : '';

        result.style.display = 'block';
      }catch(e){
        error.textContent = e.message || '오류가 발생했습니다.';
        error.style.display = 'block';
      }finally{
        loading.style.display = 'none';
        askBtn.disabled = false;
      }
    }
  </script>
</body>
</html>

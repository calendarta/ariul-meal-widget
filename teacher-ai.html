<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>아리울초 전입교원 AI 도우미</title>
  <style>
    :root{color-scheme:light dark;--bg:transparent;--card:#fff;--text:#191919;--sub:#6b7280;--line:#e5e7eb;--soft:#f7f7f5;--soft2:#f3f4f6;--accent:#2563eb;--accent-soft:#eff6ff;--green:#166534;--green-bg:#ecfdf3;--yellow:#92400e;--yellow-bg:#fffbeb;--red:#b91c1c;--red-bg:#fef2f2;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
    @media(prefers-color-scheme:dark){:root{--card:#1f1f1f;--text:#f5f5f5;--sub:#b0b3b8;--line:#383838;--soft:#262626;--soft2:#2d2d2d;--accent:#60a5fa;--accent-soft:#172554;--green:#86efac;--green-bg:#15301f;--yellow:#fcd34d;--yellow-bg:#3a2f12;--red:#fca5a5;--red-bg:#3a1d1d;--shadow:none}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:920px;margin:0 auto;padding:6px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}.header{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}.icon{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}h1{font-size:22px;line-height:1.25;margin:0;font-weight:850;letter-spacing:-.02em}.desc{font-size:14px;line-height:1.55;color:var(--sub);margin-top:5px}.mode{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px 54px;background:var(--green-bg);color:var(--green);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}textarea{width:100%;min-height:86px;max-height:220px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:12px 13px;font:inherit;font-size:15px;line-height:1.55;outline:none}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}button.ask{height:46px;border:0;border-radius:12px;background:var(--accent);color:#fff;padding:0 17px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}button.ask:disabled{opacity:.55;cursor:not-allowed}.hint{font-size:12px;color:var(--sub);margin-top:7px}.loading,.error{margin-top:14px;border-radius:14px;padding:14px;font-size:13px;line-height:1.55;display:none}.loading{background:var(--soft);border:1px solid var(--line);text-align:center;color:var(--sub)}.error{background:var(--red-bg);color:var(--red)}.result{margin-top:14px;display:none}.answerbox{background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:14px}.answer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.answer-title{font-size:13px;font-weight:800;color:var(--sub)}.copy{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer}.copy:hover{background:var(--soft2)}.answer{font-size:15px;line-height:1.78}.answer p{margin:0 0 9px}.answer p:last-child{margin-bottom:0}.answer ul{margin:7px 0 0 20px;padding:0}.answer li{margin:4px 0}.answer strong{font-weight:850}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}.badge.current{background:var(--green-bg);color:var(--green)}.badge.year-2026,.badge.confirm-2027{background:var(--yellow-bg);color:var(--yellow)}.badge.unknown{background:var(--red-bg);color:var(--red)}.sources{margin-top:12px;display:grid;gap:7px}.sources-title{font-size:12px;color:var(--sub);font-weight:800}.source{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 11px;text-decoration:none;color:var(--text)}.source:hover{background:var(--soft)}.source-main{min-width:0}.source-name{font-size:13px;font-weight:800}.source-meta{font-size:11.5px;color:var(--sub);margin-top:3px}.source-open{color:var(--sub);font-size:12px;font-weight:700;white-space:nowrap}.sync{margin-top:10px;color:var(--sub);font-size:11.5px}.foot{margin-top:10px;color:var(--sub);font-size:11.5px;text-align:right}
    @media(max-width:640px){.card{padding:14px}.composer{grid-template-columns:1fr}.ask{width:100%}.header{align-items:flex-start}h1{font-size:19px}.source{grid-template-columns:1fr}.source-open{display:none}.mode{margin-left:0}}
  </style>
</head>
<body>
  <div class="wrap"><main class="card">
    <div class="header"><div class="icon">🤖</div><div><h1>아리울초 전입교원 AI 도우미</h1><div class="desc">전입교원 가이드에 정리된 내용만 바탕으로 답합니다. 노션 전체 가이드를 검색하므로 <strong>답변에 수 초 정도 걸릴 수 있습니다.</strong> 확인되지 않은 내용은 추측하지 않습니다.</div></div></div>
    <div class="mode">✓ 노션 전체 가이드 자동 검색</div>
    <div class="composer"><textarea id="question" maxlength="500" placeholder="예: 교외체험학습을 5일 이상 가면 담임이 따로 해야 할 일이 있나요?"></textarea><button id="ask" class="ask">질문하기</button></div>
    <div class="hint">Enter는 줄바꿈, Ctrl+Enter 또는 ⌘+Enter로 질문합니다.</div>
    <div id="loading" class="loading">노션 전체 가이드에서 관련 페이지를 찾고 답변을 작성 중입니다. 자료가 많아 잠시 걸릴 수 있습니다…</div><div id="error" class="error"></div>
    <section id="result" class="result">
      <div class="answerbox"><div class="answer-head"><div class="answer-title">답변</div><button id="copy" class="copy">복사</button></div><div id="answer" class="answer"></div><div id="badges" class="badges"></div></div>
      <div id="sources" class="sources"></div><div id="sync" class="sync"></div>
    </section>
    <div class="foot">AI 답변은 전입교원 가이드의 보조 검색 기능입니다. 최신 공문·해당 학년도 지침이 우선합니다.</div>
  </main></div>
  <script>
    const q=document.getElementById('question'),askBtn=document.getElementById('ask'),loading=document.getElementById('loading'),error=document.getElementById('error'),result=document.getElementById('result'),answer=document.getElementById('answer'),badges=document.getElementById('badges'),sources=document.getElementById('sources'),sync=document.getElementById('sync'),copyBtn=document.getElementById('copy');let rawAnswer='';
    q.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))ask()});askBtn.addEventListener('click',ask);copyBtn.addEventListener('click',copyAnswer);
    function escapeHtml(str=''){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
    function renderMarkdown(text=''){const safe=escapeHtml(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');const lines=safe.split(/\n/);let html='',inList=false;const closeList=()=>{if(inList){html+='</ul>';inList=false}};for(const line of lines){const t=line.trim();if(!t){closeList();continue}if(/^[-•]\s+/.test(t)){if(!inList){html+='<ul>';inList=true}html+=`<li>${t.replace(/^[-•]\s+/,'')}</li>`}else{closeList();html+=`<p>${t}</p>`}}closeList();return html}
    function badgeIcon(type){return type==='current'?'✓':type==='unknown'?'!':'⚠'}
    function formatEdited(value){if(!value)return '';try{return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value))}catch{return ''}}
    function formatSyncTime(value){if(!value)return '';try{return new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(Number(value)))}catch{return ''}}
    async function copyAnswer(){if(!rawAnswer)return;try{await navigator.clipboard.writeText(rawAnswer);copyBtn.textContent='복사됨';setTimeout(()=>copyBtn.textContent='복사',1200)}catch{copyBtn.textContent='실패';setTimeout(()=>copyBtn.textContent='복사',1200)}}
    async function parseApiResponse(res){
      const text=await res.text();
      if(!text) return {};
      try{return JSON.parse(text)}catch{
        if(!res.ok){
          if(/error occurred|timeout|timed out|function invocation/i.test(text)) throw new Error('서버가 잠시 응답하지 못했습니다. 잠시 후 다시 시도해 주세요.');
          throw new Error(`서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요. (HTTP ${res.status})`);
        }
        throw new Error('서버 응답 형식을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.');
      }
    }
    async function ask(){const question=q.value.trim();if(!question){q.focus();return}askBtn.disabled=true;loading.style.display='block';error.style.display='none';result.style.display='none';try{const res=await fetch('/api/teacher-ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});const data=await parseApiResponse(res);if(!res.ok)throw new Error(data.error||`서버 오류가 발생했습니다. (HTTP ${res.status})`);rawAnswer=data.answer||'답변을 생성하지 못했습니다.';answer.innerHTML=renderMarkdown(rawAnswer);badges.innerHTML=(data.badges||[]).map(b=>`<span class="badge ${escapeHtml(b.type)}">${badgeIcon(b.type)} ${escapeHtml(b.label)}</span>`).join('');const list=data.sources||[];sources.innerHTML=list.length?'<div class="sources-title">근거 페이지</div>'+list.map(s=>`<a class="source" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer"><div class="source-main"><div class="source-name">📄 ${escapeHtml(s.title)}</div><div class="source-meta">${s.lastEdited?`노션 수정 ${escapeHtml(formatEdited(s.lastEdited))}`:'전입교원 가이드 근거'}</div></div><span class="source-open">페이지 열기 ↗</span></a>`).join(''):'';
      if(data.syncMode==='notion-full-live'){const count=Number(data.indexedPages||0);const t=formatSyncTime(data.refreshedAt);sync.textContent=`✓ 노션 전체 가이드 ${count}개 페이지를 자동 검색했습니다.${t?` 마지막 동기화 ${t}`:''}`}
      else if(data.syncMode==='snapshot-fallback'){sync.textContent='⚠ 노션 동기화에 실패해 저장된 지식으로 답변했습니다.'}
      else{sync.textContent='현재는 저장된 지식 스냅샷으로 답변합니다.'}
      result.style.display='block'}catch(e){error.textContent=e.message||'오류가 발생했습니다.';error.style.display='block'}finally{loading.style.display='none';askBtn.disabled=false}}
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>아리울초 전입교원 AI 도우미</title>
<style>
:root{color-scheme:light dark;--bg:transparent;--card:#fff;--text:#191919;--sub:#6b7280;--line:#e5e7eb;--soft:#f7f7f5;--accent:#2563eb;--accent-soft:#eff6ff;--green:#166534;--green-bg:#ecfdf3;--yellow:#92400e;--yellow-bg:#fffbeb;--red:#b91c1c;--red-bg:#fef2f2}
@media(prefers-color-scheme:dark){:root{--card:#1f1f1f;--text:#f5f5f5;--sub:#b0b3b8;--line:#383838;--soft:#262626;--accent:#60a5fa;--accent-soft:#172554;--green:#86efac;--green-bg:#15301f;--yellow:#fcd34d;--yellow-bg:#3a2f12;--red:#fca5a5;--red-bg:#3a1d1d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}.wrap{max-width:920px;margin:auto;padding:6px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.header{display:flex;gap:12px}.icon{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:23px}h1{font-size:22px;margin:0}.desc{font-size:14px;line-height:1.55;color:var(--sub);margin-top:5px}.mode{display:inline-flex;margin:12px 0 14px 54px;background:var(--green-bg);color:var(--green);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}textarea{width:100%;min-height:86px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:12px;font:inherit;font-size:15px}.ask{height:46px;border:0;border-radius:12px;background:var(--accent);color:#fff;padding:0 17px;font-weight:800;cursor:pointer}.hint,.sync,.foot{font-size:12px;color:var(--sub)}.hint{margin-top:7px}.loading,.error{display:none;margin-top:14px;padding:14px;border-radius:14px}.loading{background:var(--soft);color:var(--sub);text-align:center}.error{background:var(--red-bg);color:var(--red)}.result{display:none;margin-top:14px}.answerbox{background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:14px}.answer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.answer-title{font-size:13px;font-weight:800;color:var(--sub)}.copy{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer}.answer{font-size:15px;line-height:1.78}.answer p{margin:0 0 9px}.answer ul{margin:7px 0 0 20px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.badge{border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}.badge.current{background:var(--green-bg);color:var(--green)}.badge.year-2026,.badge.confirm-2027{background:var(--yellow-bg);color:var(--yellow)}.badge.unknown{background:var(--red-bg);color:var(--red)}.sources{margin-top:12px;display:grid;gap:7px}.sources-title{font-size:12px;color:var(--sub);font-weight:800}.source{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px;text-decoration:none;color:var(--text)}.source-name{font-size:13px;font-weight:800}.source-meta,.source-open{font-size:11.5px;color:var(--sub)}.sync{margin-top:10px}.foot{text-align:right;margin-top:10px}
@media(max-width:640px){.composer{grid-template-columns:1fr}.ask{width:100%}.mode{margin-left:0}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="header"><div class="icon">🤖</div><div><h1>아리울초 전입교원 AI 도우미</h1><div class="desc">저장된 검색 색인으로 관련 페이지를 빠르게 찾은 뒤, <strong>가능하면 해당 Notion 페이지를 실시간으로 다시 확인해</strong> 답합니다.</div></div></div>
<div class="mode">✓ 관련 Notion 페이지 실시간 확인 우선</div>
<div class="composer"><textarea id="question" maxlength="500" placeholder="예: 장기재직휴가는 며칠인가요?"></textarea><button id="ask" class="ask">질문하기</button></div>
<div class="hint">Enter는 줄바꿈, Ctrl+Enter 또는 ⌘+Enter로 질문합니다.</div>
<div id="loading" class="loading">관련 페이지를 찾고 Notion 최신 내용을 확인하는 중입니다…</div>
<div id="error" class="error"></div>
<section id="result" class="result"><div class="answerbox"><div class="answer-head"><div class="answer-title">답변</div><button id="copy" class="copy">복사</button></div><div id="answer" class="answer"></div><div id="badges" class="badges"></div></div><div id="sources" class="sources"></div><div id="sync" class="sync"></div></section>
<div class="foot">AI 답변은 전입교원 가이드의 보조 검색 기능입니다. 최신 공문·해당 학년도 지침이 우선합니다.</div>
</main></div>
<script>
const q=document.getElementById('question'),askBtn=document.getElementById('ask'),loading=document.getElementById('loading'),error=document.getElementById('error'),result=document.getElementById('result'),answer=document.getElementById('answer'),badges=document.getElementById('badges'),sources=document.getElementById('sources'),sync=document.getElementById('sync'),copyBtn=document.getElementById('copy');let rawAnswer='';
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))ask()});askBtn.addEventListener('click',ask);copyBtn.addEventListener('click',copyAnswer);
function escapeHtml(str=''){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderMarkdown(text=''){const safe=escapeHtml(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'),lines=safe.split(/\n/);let html='',inList=false;const close=()=>{if(inList){html+='</ul>';inList=false}};for(const line of lines){const t=line.trim();if(!t){close();continue}if(/^[-•]\s+/.test(t)){if(!inList){html+='<ul>';inList=true}html+=`<li>${t.replace(/^[-•]\s+/,'')}</li>`}else{close();html+=`<p>${t}</p>`}}close();return html}
function legacyCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='0';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=!!document.execCommand('copy')}catch{}document.body.removeChild(ta);return ok}
function setCopyState(text){copyBtn.textContent=text;setTimeout(()=>copyBtn.textContent='복사',1400)}
async function copyAnswer(){if(!rawAnswer)return;if(legacyCopy(rawAnswer)){setCopyState('복사됨');return}try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(rawAnswer);setCopyState('복사됨');return}}catch{}try{const range=document.createRange();range.selectNodeContents(answer);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);setCopyState('Ctrl+C')}catch{setCopyState('복사 불가')}}
async function parseApiResponse(res){const text=await res.text();if(!text)return{};try{return JSON.parse(text)}catch{throw new Error(res.ok?'서버 응답 형식을 처리하지 못했습니다.':`서버 오류가 발생했습니다. (HTTP ${res.status})`)}}
function formatEdited(v){if(!v)return'';try{return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return''}}
async function ask(){const question=q.value.trim();if(!question){q.focus();return}askBtn.disabled=true;loading.style.display='block';error.style.display='none';result.style.display='none';try{const res=await fetch('/api/teacher-ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});const data=await parseApiResponse(res);if(!res.ok)throw new Error(data.error||`서버 오류 (HTTP ${res.status})`);rawAnswer=data.answer||'답변을 생성하지 못했습니다.';answer.innerHTML=renderMarkdown(rawAnswer);badges.innerHTML=(data.badges||[]).map(b=>`<span class="badge ${escapeHtml(b.type)}">${b.type==='current'?'✓':b.type==='unknown'?'!':'⚠'} ${escapeHtml(b.label)}</span>`).join('');const list=data.sources||[];sources.innerHTML=list.length?'<div class="sources-title">근거 페이지</div>'+list.map(s=>`<a class="source" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer"><div><div class="source-name">📄 ${escapeHtml(s.title)}</div><div class="source-meta">${s.lastEdited?`Notion 수정 ${escapeHtml(formatEdited(s.lastEdited))}`:'전입교원 가이드 근거'}</div></div><span class="source-open">페이지 열기 ↗</span></a>`).join(''):'';if(data.syncMode==='notion-live-verified')sync.textContent=`✓ 관련 Notion 페이지 ${Number(data.livePages||0)}개를 실시간 확인해 답변했습니다.`;else if(data.syncMode==='snapshot-fallback')sync.textContent='⚠ Notion 실시간 확인이 어려워 저장된 최근 자료로 답변했습니다.';else sync.textContent='저장된 검색 색인을 기준으로 답변했습니다.';result.style.display='block'}catch(e){error.textContent=e.message||'오류가 발생했습니다.';error.style.display='block'}finally{loading.style.display='none';askBtn.disabled=false}}
</script>
</body></html>
